[package]
name = "bil-exp3"
version = "0.1.0"
edition = "2021"
publish = false
license = "LGPL-2.1-or-later"
description = "BIL experiment 3: containing the errors of C libraries, libjpeg-turbo, OpenJPEG and GDAL, behind a C layer"
build = "build.rs"

[[bin]]
name = "exp3"
path = "src/main.rs"

[dependencies]

[features]
# GDAL's part, built where libgdal-dev is installed; elsewhere a stand-in is linked.
gdal = []

[profile.release]
opt-level = 3
