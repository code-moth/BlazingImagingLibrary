name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows on x86, Linux and macOS on ARM.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Experiment 1, correctness
        # Bitwise Window independence and agreement across instruction sets, and accuracy.
        run: cargo run --release --bin exp1 -- --check

  latest-stable:
    # Reports lints that a newer compiler adds, without failing the build.
    name: lints on latest stable
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Latest stable
        run: rustup toolchain install stable --profile minimal -c clippy && rustup override set stable
      - name: Lint
        run: cargo +stable clippy --release --all-targets -- -D warnings
