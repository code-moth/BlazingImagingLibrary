name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows on x86, Linux and macOS on ARM.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # Experiment 5 is a Python extension module. On Windows its build script links against
      # this Python's stable interface, so it is set up before anything is built.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        shell: bash
        # Lint messages are also raised as annotations, which can be read without the logs.
        run: |
          set -o pipefail
          cargo clippy --release --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            grep -E "^(error|warning)|: (error|warning)" clippy.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Build
        run: cargo build --release
      - name: Tests of the bil crate
        # Built without optimization, so integer overflow on corrupt input panics and fails the
        # tests rather than wrapping silently. Includes 20,000 corrupt NITF files.
        run: cargo test -p bil
      - name: OpenJPEG
        # JPEG 2000 through the OpenJPEG the system provides. No package manager's copy is set
        # up for Windows here, so its build is tested without the feature.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -q && sudo apt-get install -y -q libopenjp2-7-dev
          else
            brew install openjpeg
          fi
      - name: Tests with OpenJPEG
        # The bindings' structures against the header, then the codec and the NITF reader's
        # JPEG 2000 Images, with damaged codestreams.
        if: runner.os != 'Windows'
        shell: bash
        env:
          BIL_REQUIRE_LAYOUT_CHECK: "1"
        run: |
          set -o pipefail
          cargo clippy --all-targets -p bil -p bil-sys --features bil/openjpeg,bil-sys/openjpeg --message-format=short -- -D warnings 2>&1 | tee clippy-opj.txt || {
            grep -E "^(error|warning)|: (error|warning)" clippy-opj.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
          # Failures are raised as annotations too.
          cargo test -p bil -p bil-sys --features bil/openjpeg,bil-sys/openjpeg 2>&1 | tee test-opj.txt || {
            grep -E -A3 "panicked|FAILED|^error|left:|right:" test-opj.txt | head -30 | cut -c1-200 | sed 's/^/::error::/'
            exit 1
          }
          if grep -q "layout of OpenJPEG's structures is not checked" test-opj.txt clippy-opj.txt; then
            echo "::error::openjpeg.h was not found, so the layout check did not run"; exit 1
          fi
      - name: Experiment 1, correctness
        # Bitwise Window independence and agreement across instruction sets, and accuracy.
        run: cargo run --release --bin exp1 -- --check
      - name: Experiment 1b, correctness
        # The same bitwise tests through the rolling buffer, against experiment 1's whole planes,
        # and reused buffers. The instruction sets tested are raised as an annotation.
        shell: bash
        run: |
          set -o pipefail
          cargo run --release --bin exp1b -- --check | tee exp1b.txt
          echo "::notice::$(grep -m1 'Instruction sets available' exp1b.txt | cut -c1-120)"
      - name: Experiment 5, borrowed arrays
        # Borrowed NumPy arrays over mapped files: valid after their Source goes, under threads,
        # read-only under Shared mapping, and nothing leaked.
        shell: bash
        run: |
          python -m pip install --quiet numpy
          python -I experiments/exp5-borrowed-arrays/check.py target/release
      # The module is built once against the stable interface, and must load in the oldest
      # Python it allows as well.
      - name: Python 3.11
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Experiment 5 on Python 3.11
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --quiet numpy
          python -I experiments/exp5-borrowed-arrays/check.py target/release
      - name: Vector code inlined
        # Rule 5 of the working notes: a vector intrinsic left as a call makes the vector code
        # slower than scalar. Checked where objdump reads the binary.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Feature detection's own calls, such as xgetbv, are not vector code.
          n=$(objdump -d target/release/exp1b | grep -E "(call|bl)\s.*(_mm256_|_mm512_|core_arch)" | grep -vcE "xgetbv|cpuid" || true)
          echo "::notice::calls to vector intrinsics in exp1b: $n"
          test "$n" -eq 0

  c-errors:
    # Experiment 3: libjpeg-turbo and OpenJPEG behind BIL's C layer, fed millions of corrupt
    # files. It links the system's own libraries, so it runs where Ubuntu provides the versions
    # its headers in vendor/ describe: libjpeg-turbo 2.1.5 and OpenJPEG 2.5.0.
    name: c errors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: experiments/exp3-c-errors
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libjpeg-turbo8 libopenjp2-7
          dpkg-query -W libjpeg-turbo8 libopenjp2-7
      - name: Format
        run: cargo fmt --check
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --release --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            grep -E "error|warning|panicked" clippy.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Experiment 3, corrupt files
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -- --check 2>&1 | tee exp3.txt || {
            grep -E "error|panicked|Passed: \*\*false" exp3.txt | head -20 | cut -c1-900 | sed 's/^/::error::/'
            exit 1
          }

  gdal-errors:
    # Experiment 3's part for GDAL: NITF and TIFF files read by GDAL behind BIL's C layer, with
    # GDAL's own state (error handlers, configuration options, driver registry, open datasets,
    # memory files, block cache) compared before and after. GDAL comes from Ubuntu's libgdal-dev;
    # the layer is built only here, through the experiment's gdal feature.
    name: gdal errors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    defaults:
      run:
        working-directory: experiments/exp3-c-errors
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: GDAL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgdal-dev
          echo "::notice::GDAL $(gdal-config --version)"
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --release --all-targets --features gdal --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            grep -E "error|warning|panicked" clippy.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Experiment 3, corrupt files through GDAL
        shell: bash
        run: |
          set -o pipefail
          cargo run --release --features gdal -- --gdal --check 2>&1 | tee exp3-gdal.txt || {
            grep -E "error|panicked|Passed: \*\*false" exp3-gdal.txt | head -20 | cut -c1-900 | sed 's/^/::error::/'
            exit 1
          }

  latest-stable:
    # Reports lints that a newer compiler adds, without failing the build.
    name: lints on latest stable
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Latest stable
        run: rustup toolchain install stable --profile minimal -c clippy && rustup override set stable
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          cargo +stable clippy --release --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            grep -E "^(error|warning)|: (error|warning)" clippy.txt | head -20 | sed 's/^/::warning::/'
            exit 1
          }

  licenses:
    # Every dependency's license must be on the allow-list in deny.toml.
    name: licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: what ships (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --config deny.toml
          command: check licenses bans sources
      - name: everything, test-only code included (deny-tests.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --config deny-tests.toml
          command: check licenses sources

  packages:
    # The packages that would be published must build.
    name: packages build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Rust crates
        run: cargo package -p bil -p bil-sys
      - name: Python package
        run: |
          cp LICENSE LINKING-EXCEPTION.md python/
          python3 -m pip install --upgrade build
          python3 -m build python

  test-data:
    # Downloads the real test files and checks them against testdata/manifest.toml.
    # Unpinned checksums, and the files each source offers, are reported as annotations.
    # Then compares BIL's NITF reader with GDAL's on every NITF file fetched.
    name: test data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: testdata/cache
          key: testdata-${{ hashFiles('testdata/manifest.toml') }}
          restore-keys: testdata-
      - name: Fetch and check
        run: python3 testdata/fetch.py --list
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: GDAL, the reference
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgdal-dev libopenjp2-7-dev
          cc -O2 -Wall -Wextra -Werror testdata/nitf_reference.c -o nitf_reference $(gdal-config --cflags) $(gdal-config --libs)
      - name: The NITF reader against GDAL
        shell: bash
        run: |
          cargo build --release --example nitf_dump --features openjpeg
          find testdata/cache -iname '*.ntf' -print0 | sort -z | xargs -0 python3 -I testdata/compare_nitf.py target/release/examples/nitf_dump ./nitf_reference
      - name: The NITF reader against GDAL, on GDAL's own NITF test files
        if: success() || failure()
        # The 19 NITF files of GDAL 3.8.4's test suite: masked images, extensions that
        # overflow, a damaged extension area, files with no images and files both refuse.
        shell: bash
        run: |
          git clone -q --depth 1 --branch v3.8.4 --filter=blob:none --sparse https://github.com/OSGeo/gdal gdal-tests
          git -C gdal-tests sparse-checkout set autotest/gdrivers/data/nitf
          find gdal-tests/autotest/gdrivers/data/nitf -iname '*.ntf' -o -iname '*.nsf' | sort | tr '\n' '\0' | xargs -0 python3 -I testdata/compare_nitf.py target/release/examples/nitf_dump ./nitf_reference

