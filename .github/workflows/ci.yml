name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux and Windows on x86, Linux and macOS on ARM.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # Experiment 5 is a Python extension module. On Windows its build script links against
      # this Python's stable interface, so it is set up before anything is built.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        shell: bash
        # Lint messages are also raised as annotations, which can be read without the logs.
        run: |
          set -o pipefail
          cargo clippy --release --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            grep -E "^(error|warning)|: (error|warning)" clippy.txt | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: Build
        run: cargo build --release
      - name: Experiment 1, correctness
        # Bitwise Window independence and agreement across instruction sets, and accuracy.
        run: cargo run --release --bin exp1 -- --check
      - name: Experiment 1b, correctness
        # The same bitwise tests through the rolling buffer, against experiment 1's whole planes,
        # and reused buffers. The instruction sets tested are raised as an annotation.
        shell: bash
        run: |
          set -o pipefail
          cargo run --release --bin exp1b -- --check | tee exp1b.txt
          echo "::notice::$(grep -m1 'Instruction sets available' exp1b.txt | cut -c1-120)"
      - name: Experiment 5, borrowed arrays
        # Borrowed NumPy arrays over mapped files: valid after their Source goes, under threads,
        # read-only under Shared mapping, and nothing leaked.
        shell: bash
        run: |
          python -m pip install --quiet numpy
          python -I experiments/exp5-borrowed-arrays/check.py target/release
      # The module is built once against the stable interface, and must load in the oldest
      # Python it allows as well.
      - name: Python 3.11
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Experiment 5 on Python 3.11
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install --quiet numpy
          python -I experiments/exp5-borrowed-arrays/check.py target/release
      - name: Vector code inlined
        # Rule 5 of the working notes: a vector intrinsic left as a call makes the vector code
        # slower than scalar. Checked where objdump reads the binary.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Feature detection's own calls, such as xgetbv, are not vector code.
          n=$(objdump -d target/release/exp1b | grep -E "(call|bl)\s.*(_mm256_|_mm512_|core_arch)" | grep -vcE "xgetbv|cpuid" || true)
          echo "::notice::calls to vector intrinsics in exp1b: $n"
          test "$n" -eq 0

  latest-stable:
    # Reports lints that a newer compiler adds, without failing the build.
    name: lints on latest stable
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Latest stable
        run: rustup toolchain install stable --profile minimal -c clippy && rustup override set stable
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          cargo +stable clippy --release --all-targets --message-format=short -- -D warnings 2>&1 | tee clippy.txt || {
            grep -E "^(error|warning)|: (error|warning)" clippy.txt | head -20 | sed 's/^/::warning::/'
            exit 1
          }

  licenses:
    # Every dependency's license must be on the allow-list in deny.toml.
    name: licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: what ships (deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --config deny.toml
          command: check licenses bans sources
      - name: everything, test-only code included (deny-tests.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --config deny-tests.toml
          command: check licenses sources

  packages:
    # The packages that would be published must build.
    name: packages build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Rust crates
        run: cargo package -p bil -p bil-sys
      - name: Python package
        run: |
          cp LICENSE LINKING-EXCEPTION.md python/
          python3 -m pip install --upgrade build
          python3 -m build python

  test-data:
    # Downloads the real test files and checks them against testdata/manifest.toml.
    # Unpinned checksums, and the files each source offers, are reported as annotations.
    name: test data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: testdata/cache
          key: testdata-${{ hashFiles('testdata/manifest.toml') }}
          restore-keys: testdata-
      - name: Fetch and check
        run: python3 testdata/fetch.py --list

