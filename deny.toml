# License and source checks for what BIL ships, run by cargo-deny in CI.
# BIL is LGPL 2.1 or later. Everything in a shipped build must be compatible with
# LGPL 2.1 itself, so that no package becomes LGPL 3 by accident (the author's ruling).
# Test-only code is checked separately, against deny-tests.toml.
#
# Apache-2.0 alone is allowed, by the author's ruling, which accepts the risk: the Free
# Software Foundation holds it incompatible with the 2.1 licenses, though not with LGPL 3.

[graph]
all-features = true
# Dev-dependencies and unpublished workspace members (experiments, test harnesses)
# never reach a package.
exclude-dev = true
exclude-unpublished = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "LGPL-2.1-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
