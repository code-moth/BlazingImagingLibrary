# License and source checks for every dependency, run by cargo-deny in CI.
# BIL is LGPL 2.1 or later, and its packages contain only LGPL-compatible builds
# (specification, section 10.6). A dependency under any license not listed here fails the build.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "LGPL-2.1-only",
  "LGPL-3.0-or-later",
  "LGPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
