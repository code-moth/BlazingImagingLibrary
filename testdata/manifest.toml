# Real test files for BIL. The files themselves are not kept in git: `fetch.py` downloads them
# into testdata/cache/ and checks each against its SHA-256. A file whose checksum is not yet
# recorded is downloaded and its checksum reported, so it can be pinned here.
#
# Source: GDAL's download cache, which mirrors the NITF Test Bed files once published by the
# U.S. National Imagery and Mapping Agency. The source page states no terms of use; the
# author of BIL has approved their use for testing.

[sources.gdal_cache]
bases = [
  "https://download-cache.osgeo.org/gdal/data/nitf/",
  "https://download.osgeo.org/gdal/data/nitf/",
]
listing_pages = ["nitf2.0/", "nitf2.1/", "jpeg2000/", "nitf2.1/scen_2_1.html"]

# Each file: where it is, which tier needs it, and what it exercises.

[[file]]
path = "nitf2.0/U_1001a.ntf"
tier = 1
exercises = "Uncompressed 1024 x 1024 8-bit mono, with geographic data"
