[workspace]
resolver = "2"
members = ["crates/bil", "crates/bil-sys", "experiments/exp1-fused-loop", "experiments/exp5-borrowed-arrays"]
# Experiment 3 links C libraries that only some systems have, so it is built on its own.
exclude = ["experiments/exp3-c-errors"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
