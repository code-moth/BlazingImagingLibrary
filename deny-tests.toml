# License and source checks for everything, test-only code included, run by cargo-deny in CI.
# Test references such as NITRO (LGPL 3.0) may be used here, because they never ship.
# What ships is checked against deny.toml.

[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "LGPL-2.1-only",
  "LGPL-3.0-or-later",
  "LGPL-3.0-only",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
